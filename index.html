<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BNETWORKING - Validation QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 25px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      padding: 14px 25px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🎟️ BNETWORKING</h1>

  <p>Présentez le QR code devant la caméra</p>

  <div id="reader"></div>

  <div id="result">
    📷 En attente du scan...
  </div>

  <button onclick="restartScanner()">
    📷 Scanner le suivant
  </button>


  <script>

    // =====================================================
    // URL APPS SCRIPT
    // =====================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbz9z_MdYVDI7yDZlqVwEMrtKft5wYzGPxQp9lK91IP7Wb--Tvaj7ReadJZMgF0Gr65d_Q/exec";


    let scanner;
    let scanEnCours = false;


    // =====================================================
    // DÉMARRAGE DU SCANNER
    // =====================================================

    function demarrerScanner() {

      scanner = new Html5Qrcode("reader");

      scanner.start(
        { facingMode: "environment" },

        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        onScanSuccess

      ).catch(function(error) {

        afficherResultat(
          "❌ Impossible d'accéder à la caméra.",
          "#f8d7da"
        );

      });
    }


    // =====================================================
    // QR SCANNÉ
    // =====================================================

    function onScanSuccess(decodedText) {

      if (scanEnCours) {
        return;
      }

      scanEnCours = true;

      afficherResultat(
        "⏳ Vérification du QR code...",
        "#fff3cd"
      );

      scanner.pause(true);


      // =====================================================
      // EXTRACTION DE L'IDENTIFIANT QR
      // =====================================================

      let identifiant = "";

      try {

        // Si le QR contient une URL avec ?id=QR1
        const url = new URL(decodedText);

        identifiant = url.searchParams.get("id");

      } catch (error) {

        // Si le QR contient directement QR1
        identifiant = decodedText;

      }


      // Nettoyage
      identifiant = String(identifiant).trim().toUpperCase();


      // =====================================================
      // VÉRIFICATION DE L'IDENTIFIANT
      // =====================================================

      if (!/^QR\d+$/i.test(identifiant)) {

        afficherResultat(
          "❌ QR NON VALIDE",
          "#f8d7da"
        );

        return;
      }


      // =====================================================
      // TRANSFORMATION EN CODE DE VALIDATION
      // QR1 → BNETWORKING-QR1
      // =====================================================

      const codeValidation =
        "BNETWORKING-" + identifiant;


      // =====================================================
      // ENVOI À APPS SCRIPT
      // =====================================================

      fetch(
        APPS_SCRIPT_URL +
        "?code=" +
        encodeURIComponent(codeValidation)
      )

      .then(response => response.json())

      .then(data => {

        afficherResultat(
          data.message,
          data.color
        );

      })

      .catch(error => {

        console.error(error);

        afficherResultat(
          "❌ Erreur de connexion au serveur.",
          "#f8d7da"
        );

      });

    }


    // =====================================================
    // AFFICHAGE DU RÉSULTAT
    // =====================================================

    function afficherResultat(message, couleur) {

      const result =
        document.getElementById("result");

      result.innerHTML = message;

      result.style.background = couleur;

    }


    // =====================================================
    // SCANNER LE QR SUIVANT
    // =====================================================

    function restartScanner() {

      scanEnCours = false;

      afficherResultat(
        "📷 En attente du scan...",
        "#f5f5f5"
      );

      scanner.resume();

    }


    // =====================================================
    // LANCEMENT
    // =====================================================

    window.onload = function() {

      demarrerScanner();

    };

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BNETWORKING - Validation QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 25px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎟️ BNETWORKING</h1>

  <p>Présentez le QR code devant la caméra</p>

  <div id="reader"></div>

  <div id="result">
    📷 En attente du scan...
  </div>

  <script>

    function onScanSuccess(decodedText, decodedResult) {

      document.getElementById("result").innerHTML =
        "✅ QR détecté :<br><br>" + decodedText;

    }

    function onScanFailure(error) {
      // On ignore les erreurs pendant la recherche du QR
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);

  </script>

</body>
</html>

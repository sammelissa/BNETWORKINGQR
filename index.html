```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BNETWORKING</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .logo p {
      margin-top: 5px;
      color: #666;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    .result-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 17px;
      line-height: 1.6;
      word-break: break-word;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .info {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .info:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
      color: #555;
    }

    .value {
      font-size: 18px;
    }

    .paiement-oui {
      font-weight: bold;
      color: #198754;
    }

    .paiement-non {
      font-weight: bold;
      color: #dc3545;
    }

    .hidden {
      display: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- ========================= -->
  <!-- PAGE SCANNER -->
  <!-- ========================= -->

  <div id="scannerPage">

    <div class="logo">
      <h1>BNETWORKING</h1>
      <p>Validation des invitations</p>
    </div>

    <div id="reader"></div>

    <div id="scanResult" class="result-box hidden"></div>

  </div>


  <!-- ========================= -->
  <!-- PAGE INFORMATIONS QR -->
  <!-- ========================= -->

  <div id="pageQR" class="hidden">

    <div class="logo">
      <h1>BNETWORKING</h1>
      <p>Invitation</p>
    </div>

    <div class="card">

      <h2>Informations de l'invité</h2>

      <div class="info">
        <span class="label">ID QR</span>
        <span id="qrId" class="value">—</span>
      </div>

      <div class="info">
        <span class="label">Nom</span>
        <span id="nom" class="value">—</span>
      </div>

      <div class="info">
        <span class="label">Prénom</span>
        <span id="prenom" class="value">—</span>
      </div>

      <div class="info">
        <span class="label">Fonction / Entreprise</span>
        <span id="fonction" class="value">—</span>
      </div>

      <div class="info">
        <span class="label">Paiement</span>
        <span id="paiement" class="value">—</span>
      </div>

    </div>

    <div id="pageResult" class="result-box hidden"></div>

  </div>

</div>


<script>

  /* =====================================================
     URL GOOGLE APPS SCRIPT
     ===================================================== */

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbw6W6Ed4HEF7j2BFzwKCVkpUfuK4Bkma1V9diSWD1vciB9RChRAeXMfEAsy0MOa95jBsA/exec";


  /* =====================================================
     VARIABLES
     ===================================================== */

  let scanner = null;
  let scanEnCours = false;


  /* =====================================================
     AFFICHER UN RESULTAT
     ===================================================== */

  function afficherResultat(message, color) {

    const box = document.getElementById("scanResult");

    box.innerHTML = message;

    box.style.backgroundColor =
      color || "#e9ecef";

    box.classList.remove("hidden");
  }


  /* =====================================================
     AFFICHER RESULTAT PAGE QR
     ===================================================== */

  function afficherResultatPage(message, color) {

    const box = document.getElementById("pageResult");

    box.innerHTML = message;

    box.style.backgroundColor =
      color || "#e9ecef";

    box.classList.remove("hidden");
  }


  /* =====================================================
     EXTRAIRE L'ID DU QR
     ===================================================== */

  function extraireIdQR(decodedText) {

    try {

      const url = new URL(decodedText);

      const id = url.searchParams.get("id");

      if (id) {
        return id.trim().toUpperCase();
      }

    } catch (e) {

      // Le QR peut contenir directement QR3
      // ou BNETWORKING-QR3

    }


    const texte = String(decodedText).trim();

    const matchQR =
      texte.match(/QR\d+/i);

    if (matchQR) {

      return matchQR[0]
        .trim()
        .toUpperCase();

    }

    return null;
  }


  /* =====================================================
     CONVERTIR QR3 -> BNETWORKING-QR3
     ===================================================== */

  function convertirEnCodeValidation(id) {

    id = String(id)
      .trim()
      .toUpperCase();

    if (id.startsWith("BNETWORKING-")) {

      return id;

    }

    if (id.startsWith("QR")) {

      return "BNETWORKING-" + id;

    }

    return null;
  }


  /* =====================================================
     VALIDATION DU QR
     ===================================================== */

  async function validerQRCode(codeValidation) {

    afficherResultat(
      "⏳ Vérification du QR code...",
      "#fff3cd"
    );

    try {

      const url =
        APPS_SCRIPT_URL +
        "?code=" +
        encodeURIComponent(codeValidation) +
        "&t=" +
        Date.now();

      console.log("URL envoyée :", url);

      const response = await fetch(url, {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });

      console.log(
        "Statut serveur :",
        response.status
      );

      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }

      const texte =
        await response.text();

      console.log(
        "Réponse serveur :",
        texte
      );

      let resultat;

      try {

        resultat =
          JSON.parse(texte);

      } catch (e) {

        throw new Error(
          "Réponse serveur invalide"
        );

      }


      /* ===============================================
         AFFICHAGE
         =============================================== */

      let message =
        resultat.message ||
        "Réponse reçue du serveur.";

      if (
        resultat.success === true &&
        resultat.invite
      ) {

        message =
          "✅ QR CODE VALIDE<br><br>" +

          "<strong>" +
          resultat.invite +
          "</strong><br>" +

          (
            resultat.fonction
              ? resultat.fonction + "<br>"
              : ""
          ) +

          (
            resultat.paiement
              ? "<br>💳 Paiement : <strong>" +
                resultat.paiement +
                "</strong>"
              : ""
          );

      }


      afficherResultat(
        message,
        resultat.color || "#d1e7dd"
      );


    } catch (erreur) {

      console.error(
        "Erreur complète :",
        erreur
      );

      afficherResultat(
        "❌ Erreur de connexion au serveur.<br><br>" +
        "<small>Veuillez vérifier votre connexion Internet et réessayer.</small>",
        "#f8d7da"
      );

    }

  }


  /* =====================================================
     SCAN SUCCESS
     ===================================================== */

  async function onScanSuccess(decodedText) {

    if (scanEnCours) {
      return;
    }

    scanEnCours = true;

    console.log(
      "QR détecté :",
      decodedText
    );


    const id =
      extraireIdQR(decodedText);


    if (!id) {

      afficherResultat(
        "❌ QR CODE NON VALIDE",
        "#f8d7da"
      );

      scanEnCours = false;

      return;

    }


    const codeValidation =
      convertirEnCodeValidation(id);


    if (!codeValidation) {

      afficherResultat(
        "❌ Identifiant QR invalide.",
        "#f8d7da"
      );

      scanEnCours = false;

      return;

    }


    console.log(
      "ID QR :",
      id
    );

    console.log(
      "Code validation :",
      codeValidation
    );


    await validerQRCode(
      codeValidation
    );


    /* ===============================================
       Permettre un nouveau scan après 3 secondes
       =============================================== */

    setTimeout(function() {

      scanEnCours = false;

    }, 3000);

  }


  /* =====================================================
     ERREUR DE SCAN CAMERA
     ===================================================== */

  function onScanFailure(error) {

    // Ne rien afficher.
    // html5-qrcode appelle cette fonction
    // très fréquemment pendant la recherche du QR.

  }


  /* =====================================================
     DEMARRER LA CAMERA
     ===================================================== */

  function demarrerScanner() {

    scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          },
          rememberLastUsedCamera: true
        },
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  }


  /* =====================================================
     PAGE INFORMATIONS DU QR
     ===================================================== */

  async function afficherPageQR(id) {

    document
      .getElementById("scannerPage")
      .classList.add("hidden");

    document
      .getElementById("pageQR")
      .classList.remove("hidden");


    document
      .getElementById("qrId")
      .textContent = id;


    try {

      const url =
        APPS_SCRIPT_URL +
        "?id=" +
        encodeURIComponent(id) +
        "&t=" +
        Date.now();


      console.log(
        "URL informations :",
        url
      );


      const response =
        await fetch(url, {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        });


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      const texte =
        await response.text();


      console.log(
        "Réponse informations :",
        texte
      );


      let resultat;

      try {

        resultat =
          JSON.parse(texte);

      } catch (e) {

        throw new Error(
          "Réponse JSON invalide"
        );

      }


      if (!resultat.success) {

        afficherResultatPage(
          "❌ " +
          (
            resultat.message ||
            "QR code introuvable."
          ),
          "#f8d7da"
        );

        return;

      }


      /* ===============================================
         AFFICHAGE DES INFORMATIONS
         =============================================== */

      document
        .getElementById("nom")
        .textContent =
          resultat.nom || "—";


      document
        .getElementById("prenom")
        .textContent =
          resultat.prenom || "—";


      document
        .getElementById("fonction")
        .textContent =
          resultat.fonction || "—";


      const paiement =
        document.getElementById("paiement");


      paiement.textContent =
        resultat.paiement || "NON";


      if (
        String(resultat.paiement)
          .toUpperCase() === "OUI"
      ) {

        paiement.className =
          "value paiement-oui";

      } else {

        paiement.className =
          "value paiement-non";

      }


    } catch (erreur) {

      console.error(
        "Erreur page QR :",
        erreur
      );


      afficherResultatPage(
        "❌ Erreur de connexion au serveur.<br><br>" +
        "<small>Impossible de récupérer les informations du QR.</small>",
        "#f8d7da"
      );

    }

  }


  /* =====================================================
     INITIALISATION
     ===================================================== */

  function initialiser() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* ===============================================
       SI ?id=QR3
       → PAGE INFORMATIONS
       =============================================== */

    if (id) {

      afficherPageQR(
        id.trim().toUpperCase()
      );

      return;

    }


    /* ===============================================
       SINON
       → APPLICATION SCANNER
       =============================================== */

    demarrerScanner();

  }


  /* =====================================================
     LANCEMENT
     ===================================================== */

  window.addEventListener(
    "load",
    initialiser
  );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BNETWORKING - Vérification QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      font-size: 17px;
      line-height: 1.6;
      text-align: left;
    }

    #result strong {
      font-size: 19px;
    }

    .waiting {
      display: block !important;
      background: #f4f4f4;
      text-align: center !important;
    }

    .loading {
      display: block !important;
      background: #fff3cd;
      color: #856404;
      text-align: center !important;
    }

    .success {
      display: block !important;
      background: #d4edda;
      color: #155724;
    }

    .error {
      display: block !important;
      background: #f8d7da;
      color: #721c24;
    }

    button {
      margin-top: 18px;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BNETWORKING</h1>

  <div class="subtitle">
    Vérification des invitations
  </div>

  <div id="reader"></div>

  <div id="result" class="waiting">
    📷 En attente du scan...
  </div>

  <button
    id="restartButton"
    style="display:none;"
    onclick="redemarrerScanner()">
    Scanner un autre QR code
  </button>

</div>


<script>

/* =====================================================
   NOUVEAU DÉPLOIEMENT APPS SCRIPT
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyboEElOsf-S5FPVGXAuhQcdsPD2kk1z-ITQ8UpGAi-OUbkzIWQPWXpviDpe5h9rE03Hw/exec";


let scanner = null;
let scannerActif = false;
let verificationEnCours = false;


/* =====================================================
   AFFICHER UN MESSAGE
   ===================================================== */

function afficherMessage(message, type) {

  const result =
    document.getElementById("result");

  result.className = type;

  result.innerHTML = message;

  result.style.display = "block";
}


/* =====================================================
   EXTRAIRE QR4 DU QR
   ===================================================== */

function extraireQR(decodedText) {

  const texte =
    String(decodedText).trim();

  /*
   Le QR contient par exemple :

   https://sammelissa.github.io/BNETWORKINGQR/?id=QR4
  */

  try {

    const url =
      new URL(texte);

    const id =
      url.searchParams.get("id");

    if (id) {

      const qr =
        id.trim().toUpperCase();

      if (/^QR\d+$/.test(qr)) {

        return qr;

      }

    }

  } catch (e) {

    // Le contenu n'est pas une URL.
  }


  /*
   Sécurité supplémentaire si jamais
   le QR contient directement QR4.
  */

  const match =
    texte.match(/\bQR\d+\b/i);

  if (match) {

    return match[0].toUpperCase();

  }


  return null;
}


/* =====================================================
   VERIFICATION AVEC APPS SCRIPT
   ===================================================== */

function verifierQR(decodedText) {

  if (verificationEnCours) {
    return;
  }

  verificationEnCours = true;


  const qr =
    extraireQR(decodedText);


  if (!qr) {

    afficherMessage(
      "❌ QR code non reconnu.",
      "error"
    );

    verificationEnCours = false;

    return;
  }


  afficherMessage(
    "⏳ Vérification du QR code...",
    "loading"
  );


  /*
   IMPORTANT :

   On envoie QR4 à Apps Script.

   Apps Script recevra :

   ?code=QR4

   et non :

   ?code=BNETWORKING-QR4
  */

  const url =
    APPS_SCRIPT_URL +
    "?code=" +
    encodeURIComponent(qr) +
    "&callback=recevoirResultat";


  /*
   JSONP :
   aucun fetch,
   donc pas de problème CORS.
  */

  const ancienScript =
    document.getElementById("jsonpScript");

  if (ancienScript) {
    ancienScript.remove();
  }


  const script =
    document.createElement("script");

  script.id = "jsonpScript";

  script.src = url;


  script.onerror = function() {

    afficherMessage(
      "❌ Erreur de connexion au serveur.",
      "error"
    );

    verificationEnCours = false;

    document
      .getElementById("restartButton")
      .style.display = "inline-block";
  };


  document.body.appendChild(script);


  /*
   Sécurité :
   si aucune réponse après 10 secondes.
  */

  setTimeout(function() {

    if (verificationEnCours) {

      afficherMessage(
        "❌ Le serveur ne répond pas.",
        "error"
      );

      verificationEnCours = false;

      document
        .getElementById("restartButton")
        .style.display = "inline-block";

    }

  }, 10000);

}


/* =====================================================
   REPONSE APPS SCRIPT
   ===================================================== */

function recevoirResultat(data) {

  verificationEnCours = false;


  if (!data) {

    afficherMessage(
      "❌ Réponse du serveur invalide.",
      "error"
    );

    document
      .getElementById("restartButton")
      .style.display = "inline-block";

    return;
  }


  /*
   Apps Script renvoie par exemple :

   {
     message: "...",
     color: "#d4edda"
   }
  */

  let type = "error";


  if (
    data.success === true ||
    (
      data.color &&
      data.color.toLowerCase() === "#d4edda"
    )
  ) {

    type = "success";

  }


  afficherMessage(
    data.message ||
    "Réponse reçue du serveur.",
    type
  );


  document
    .getElementById("restartButton")
    .style.display = "inline-block";
}


/* =====================================================
   DEMARRER LE SCANNER
   ===================================================== */

function demarrerScanner() {

  verificationEnCours = false;


  document
    .getElementById("restartButton")
    .style.display = "none";


  afficherMessage(
    "📷 En attente du scan...",
    "waiting"
  );


  if (!scanner) {

    scanner =
      new Html5Qrcode("reader");

  }


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      traiterScan(decodedText);

    },

    function(errorMessage) {

      // Ignorer les erreurs normales
      // pendant la recherche du QR.

    }

  )
  .then(function() {

    scannerActif = true;

  })
  .catch(function(error) {

    console.error(error);

    afficherMessage(
      "❌ Impossible d'accéder à la caméra.<br><br>" +
      "Autorisez l'accès à la caméra puis rechargez la page.",
      "error"
    );

  });

}


/* =====================================================
   TRAITER LE SCAN
   ===================================================== */

async function traiterScan(decodedText) {

  if (verificationEnCours) {
    return;
  }


  /*
   Arrêter la caméra avant la vérification.
  */

  if (scanner && scannerActif) {

    try {

      await scanner.stop();

      scannerActif = false;

    } catch (e) {

      console.log(e);

    }

  }


  verifierQR(decodedText);
}


/* =====================================================
   REDEMARRER
   ===================================================== */

async function redemarrerScanner() {

  document
    .getElementById("restartButton")
    .style.display = "none";


  if (scanner && scannerActif) {

    try {

      await scanner.stop();

    } catch (e) {

      console.log(e);

    }

    scannerActif = false;
  }


  demarrerScanner();
}


/* =====================================================
   LANCEMENT
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    demarrerScanner();

  }
);

</script>

</body>
</html>

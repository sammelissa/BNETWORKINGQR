```html
<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BNETWORKING - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
    }

    #reader {
      max-width: 500px;
      margin: 25px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      font-size: 17px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

  <h1>BNETWORKING</h1>

  <p>Scanner de validation des invitations</p>

  <div id="reader"></div>

  <div id="result">
    Scannez une invitation...
  </div>


<script>


/* ==================================================
   GOOGLE APPS SCRIPT
   ================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwRJbY87cuI7DxyCngIkGnDqjAkiZt9KphNp4LjKxrmGIqNTxus0SZSh1mFFmUl3kIL7g/exec";


/* ==================================================
   ÉVITER PLUSIEURS SCANS EN MÊME TEMPS
   ================================================== */

let scanEnCours = false;


/* ==================================================
   AFFICHER LE RESULTAT
   ================================================== */

function afficherResultat(message, color) {

  const result =
    document.getElementById("result");

  result.innerHTML = message;

  result.style.backgroundColor =
    color || "#eeeeee";

}


/* ==================================================
   EXTRAIRE L'ID DU QR
   ================================================== */

function recupererIdQR(texte) {

  try {

    const url = new URL(texte);

    const id =
      url.searchParams.get("id");

    if (id) {

      return id
        .trim()
        .toUpperCase();

    }

  } catch (e) {

    // Le QR peut aussi contenir directement QR1
  }


  const match =
    String(texte).match(/QR\d+/i);

  if (match) {

    return match[0]
      .trim()
      .toUpperCase();

  }


  return null;

}


/* ==================================================
   CONVERTIR QR1 → BNETWORKING-QR1
   ================================================== */

function creerCodeValidation(id) {

  if (
    id.toUpperCase().startsWith("BNETWORKING-")
  ) {

    return id.toUpperCase();

  }

  return "BNETWORKING-" +
    id.toUpperCase();

}


/* ==================================================
   VALIDATION
   ================================================== */

function validerQR(code) {

  afficherResultat(
    "⏳ Vérification du QR code...",
    "#fff3cd"
  );


  /*
   * Création d'une balise script.
   *
   * Cela évite le problème de connexion
   * rencontré avec fetch().
   */

  const callbackName =
    "bnetworking_" +
    Date.now();


  window[callbackName] =
    function(data) {

      afficherResultat(
        data.message ||
        "Réponse reçue.",
        data.color ||
        "#eeeeee"
      );


      delete window[callbackName];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      setTimeout(
        function() {

          scanEnCours = false;

        },
        2500
      );

    };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?code=" +
    encodeURIComponent(code) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      afficherResultat(
        "❌ Erreur de connexion au serveur.",
        "#f8d7da"
      );


      delete window[callbackName];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      scanEnCours = false;

    };


  document.body.appendChild(script);

}


/* ==================================================
   QR SCANNÉ
   ================================================== */

function onScanSuccess(decodedText) {

  if (scanEnCours) {

    return;

  }


  scanEnCours = true;


  console.log(
    "QR détecté :",
    decodedText
  );


  /*
   * Récupérer QR1, QR2, QR3...
   */

  const id =
    recupererIdQR(decodedText);


  if (!id) {

    afficherResultat(
      "❌ QR CODE NON VALIDE",
      "#f8d7da"
    );

    scanEnCours = false;

    return;

  }


  /*
   * QR1 → BNETWORKING-QR1
   */

  const codeValidation =
    creerCodeValidation(id);


  console.log(
    "ID :",
    id
  );


  console.log(
    "Code validation :",
    codeValidation
  );


  /*
   * Envoyer à Apps Script
   */

  validerQR(
    codeValidation
  );

}


/* ==================================================
   ERREUR DE LECTURE CAMERA
   ================================================== */

function onScanFailure(error) {

  // Rien à afficher.
  // Cette fonction est appelée très souvent
  // pendant la recherche du QR.

}


/* ==================================================
   LANCER LE SCANNER
   ================================================== */

const scanner =
  new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true
    },

    false
  );


scanner.render(
  onScanSuccess,
  onScanFailure
);


</script>

</body>

</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BNETWORKING - Scan QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      line-height: 1.6;
    }

    #result.success {
      background: #d4edda;
      color: #155724;
    }

    #result.error {
      background: #f8d7da;
      color: #721c24;
    }

    #result.loading {
      background: #fff3cd;
      color: #856404;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 8px;
      background: #222;
      color: white;

      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    .info {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>BNETWORKING</h1>

    <div class="subtitle">
      Contrôle des invitations
    </div>

    <div id="reader"></div>

    <div id="result"></div>

    <button id="restartButton" style="display:none;">
      Scanner un autre QR code
    </button>

    <div class="info">
      Présentez le QR code de l'invitation devant la caméra.
    </div>

  </div>


  <script>

    /* =====================================================
       LIEN DU NOUVEAU DÉPLOIEMENT APPS SCRIPT
       ===================================================== */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwRJbY87cuI7DxyCngIkGnDqjAkiZt9KphNp4LjKxrmGIqNTxus0SZSh1mFFmUl3kIL7g/exec";


    let html5QrCode = null;
    let scanning = false;
    let traitementEnCours = false;


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const resultDiv =
      document.getElementById("result");

    const restartButton =
      document.getElementById("restartButton");


    /* =====================================================
       AFFICHER UN RESULTAT
       ===================================================== */

    function afficherResultat(message, type) {

      resultDiv.style.display = "block";

      resultDiv.className = type;

      resultDiv.innerHTML = message;
    }


    /* =====================================================
       EXTRAIRE L'IDENTIFIANT DU QR
       ===================================================== */

    function extraireIdentifiant(decodedText) {

      decodedText =
        String(decodedText).trim();


      /*
       Exemple :

       https://sammelissa.github.io/BNETWORKINGQR/?id=QR4

       devient :

       QR4
      */

      try {

        const url =
          new URL(decodedText);

        const id =
          url.searchParams.get("id");

        if (id) {

          return id
            .trim()
            .toUpperCase();

        }

      } catch (e) {

        // Ce n'est pas une URL.
      }


      /*
       Si le QR contient directement :

       QR4
      */

      const matchQR =
        decodedText.match(/QR\d+/i);

      if (matchQR) {

        return matchQR[0]
          .toUpperCase();

      }


      /*
       Si le QR contient :

       BNETWORKING-QR4
      */

      const matchBN =
        decodedText.match(
          /BNETWORKING-QR\d+/i
        );

      if (matchBN) {

        return matchBN[0]
          .replace(
            /BNETWORKING-/i,
            ""
          )
          .toUpperCase();

      }


      return null;
    }


    /* =====================================================
       VALIDATION DU QR
       ===================================================== */

    async function validerQRCode(decodedText) {

      if (traitementEnCours) {
        return;
      }

      traitementEnCours = true;


      const id =
        extraireIdentifiant(decodedText);


      if (!id) {

        afficherResultat(
          "❌ QR code non reconnu.",
          "error"
        );

        traitementEnCours = false;

        return;
      }


      /*
       QR4
       devient :

       BNETWORKING-QR4
      */

      const codeValidation =
        "BNETWORKING-" + id;


      afficherResultat(
        "⏳ Vérification du QR code...",
        "loading"
      );


      /*
       Arrêt temporaire du scanner
      */

      if (html5QrCode && scanning) {

        try {

          await html5QrCode.stop();

          scanning = false;

        } catch (e) {

          console.log(e);

        }

      }


      /*
       URL de validation Apps Script

       .../exec?code=BNETWORKING-QR4
      */

      const validationURL =
        APPS_SCRIPT_URL +
        "?code=" +
        encodeURIComponent(
          codeValidation
        );


      /*
       On utilise directement l'URL de
       validation pour éviter les problèmes
       de communication entre GitHub Pages
       et Google Apps Script.
      */

      window.location.href =
        validationURL;
    }


    /* =====================================================
       DEMARRER LE SCANNER
       ===================================================== */

    async function demarrerScanner() {

      traitementEnCours = false;

      restartButton.style.display =
        "none";

      resultDiv.style.display =
        "none";


      if (!html5QrCode) {

        html5QrCode =
          new Html5Qrcode("reader");

      }


      try {

        await html5QrCode.start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },

          (decodedText) => {

            validerQRCode(
              decodedText
            );

          },

          (errorMessage) => {

            // Les erreurs de lecture normales
            // sont ignorées.

          }

        );

        scanning = true;

      } catch (error) {

        console.error(error);

        afficherResultat(
          "❌ Impossible d'accéder à la caméra.<br><br>" +
          "Vérifiez que vous avez autorisé l'accès à la caméra.",
          "error"
        );

      }

    }


    /* =====================================================
       BOUTON SCANNER À NOUVEAU
       ===================================================== */

    restartButton.addEventListener(
      "click",
      () => {

        demarrerScanner();

      }
    );


    /* =====================================================
       DEMARRAGE AUTOMATIQUE
       ===================================================== */

    window.addEventListener(
      "load",
      () => {

        demarrerScanner();

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BNETWORKING</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {

    .logo {
      text-align: center;

      display: none;

  </style>

</head>


<body>

<div class="container">


  <!-- ======================================
       APPLICATION SCANNER
       ====================================== -->

  <div id="scannerPage">

    <div class="logo">

      <h1>BNETWORKING</h1>

      <p>
        Validation des invitations
      </p>

    </div>

    <div id="reader"></div>

    <div
      id="scanResult"
      class="result hidden">
    </div>

  </div>



  <!-- ======================================
       PAGE INFORMATIONS QR
       ====================================== -->

  <div
    id="pageQR"
    class="hidden">

    <div class="logo">

      <h1>BNETWORKING</h1>

      <p>
        Invitation
      </p>

    </div>


    <div class="card">

      <h2>
        Informations de l'invité
      </h2>


      <div class="info">

        <span class="label">
          ID QR
        </span>

        <span
          id="qrId"
          class="value">
          —
        </span>

      </div>


      <div class="info">

        <span class="label">
          Nom
        </span>

        <span
          id="nom"
          class="value">
          —
        </span>

      </div>


      <div class="info">

        <span class="label">
          Prénom
        </span>

        <span
          id="prenom"
          class="value">
          —
        </span>

      </div>


      <div class="info">

        <span class="label">
          Fonction / Entreprise
        </span>

        <span
          id="fonction"
          class="value">
          —
        </span>

      </div>


      <div class="info">

        <span class="label">
          Paiement
        </span>

        <span
          id="paiement"
          class="value">
          —
        </span>

      </div>

    </div>


    <div
      id="pageResult"
      class="result hidden">
    </div>

  </div>

</div>



<script>


/* ==========================================
   GOOGLE APPS SCRIPT
   ========================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwW0_4qtHFQoFwXw7fkSlwRl6K_cHlcdU1W55WyiF49a-4Z49PS-90PZd1r7GlH3sv9Dg/exec";


/* ==========================================
   VARIABLES
   ========================================== */

let scanEnCours = false;


/* ==========================================
   RESULTAT SCANNER
   ========================================== */

function afficherResultat(message, color) {

  const box =
    document.getElementById("scanResult");

  box.innerHTML = message;

  box.style.backgroundColor =
    color || "#eeeeee";

  box.classList.remove("hidden");

}


/* ==========================================
   RESULTAT PAGE QR
   ========================================== */

function afficherResultatPage(message, color) {

  const box =
    document.getElementById("pageResult");

  box.innerHTML = message;

  box.style.backgroundColor =
    color || "#eeeeee";

  box.classList.remove("hidden");

}


/* ==========================================
   EXTRAIRE ID
   ========================================== */

function extraireIdQR(decodedText) {

  try {

    const url =
      new URL(decodedText);

    const id =
      url.searchParams.get("id");

    if (id) {

      return id
        .trim()
        .toUpperCase();

    }

  } catch (e) {

    // QR contenant directement du texte

  }


  const texte =
    String(decodedText).trim();


  const match =
    texte.match(/QR\d+/i);


  if (match) {

    return match[0]
      .trim()
      .toUpperCase();

  }


  return null;

}


/* ==========================================
   CONVERTIR QR3
   EN BNETWORKING-QR3
   ========================================== */

function convertirCode(id) {

  id =
    String(id)
      .trim()
      .toUpperCase();


  if (
    id.startsWith("BNETWORKING-")
  ) {

    return id;

  }


  if (
    id.startsWith("QR")
  ) {

    return "BNETWORKING-" + id;

  }


  return null;

}


/* ==========================================
   JSONP
   ========================================== */

function appelerServeur(params, callback) {

  const callbackName =
    "jsonpCallback_" +
    Date.now();


  window[callbackName] =
    function(resultat) {

      delete window[callbackName];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

      callback(resultat);

    };


  const query =
    new URLSearchParams(params);


  query.set(
    "callback",
    callbackName
  );


  query.set(
    "t",
    Date.now()
  );


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?" +
    query.toString();


  script.onerror =
    function() {

      delete window[callbackName];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

      callback({
        success: false,
        erreurConnexion: true
      });

    };


  document
    .body
    .appendChild(script);

}


/* ==========================================
   VALIDATION QR
   ========================================== */

function validerQRCode(codeValidation) {

  afficherResultat(
    "⏳ Vérification du QR code...",
    "#fff3cd"
  );


  appelerServeur(
    {
      code: codeValidation
    },

    function(resultat) {


      if (
        resultat.erreurConnexion
      ) {

        afficherResultat(

          "❌ Erreur de connexion au serveur.",

          "#f8d7da"

        );

        scanEnCours = false;

        return;

      }


      let message =
        resultat.message ||
        "Réponse reçue.";


      if (
        resultat.success === true &&
        resultat.invite
      ) {

        message =
          "✅ QR CODE VALIDE<br><br>" +

          "<strong>" +
          resultat.invite +
          "</strong><br>" +

          (
            resultat.fonction
              ? resultat.fonction + "<br>"
              : ""
          ) +

          (
            resultat.paiement
              ? "<br>💳 Paiement : <strong>" +
                resultat.paiement +
                "</strong>"
              : ""
          );

      }


      afficherResultat(
        message,
        resultat.color || "#d1e7dd"
      );


      setTimeout(
        function() {

          scanEnCours = false;

        },
        3000
      );

    }
  );

}


/* ==========================================
   SCAN SUCCESS
   ========================================== */

function onScanSuccess(decodedText) {

  if (scanEnCours) {

    return;

  }


  scanEnCours = true;


  console.log(
    "QR détecté :",
    decodedText
  );


  const id =
    extraireIdQR(decodedText);


  if (!id) {

    afficherResultat(
      "❌ QR CODE NON VALIDE",
      "#f8d7da"
    );

    scanEnCours = false;

    return;

  }


  const codeValidation =
    convertirCode(id);


  if (!codeValidation) {

    afficherResultat(
      "❌ Identifiant QR invalide.",
      "#f8d7da"
    );

    scanEnCours = false;

    return;

  }


  console.log(
    "ID :",
    id
  );


  console.log(
    "Code validation :",
    codeValidation
  );


  validerQRCode(
    codeValidation
  );

}


/* ==========================================
   ECHEC SCAN
   ========================================== */

function onScanFailure(error) {

  // Ne rien afficher

}


/* ==========================================
   DEMARRER SCANNER
   ========================================== */

function demarrerScanner() {

  const scanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true
      },

      false
    );


  scanner.render(
    onScanSuccess,
    onScanFailure
  );

}


/* ==========================================
   PAGE INFORMATIONS QR
   ========================================== */

function afficherPageQR(id) {

  document
    .getElementById("scannerPage")
    .classList.add("hidden");


  document
    .getElementById("pageQR")
    .classList.remove("hidden");


  document
    .getElementById("qrId")
    .textContent = id;


  afficherResultatPage(
    "⏳ Chargement des informations...",
    "#fff3cd"
  );


  appelerServeur(
    {
      id: id
    },

    function(resultat) {


      if (
        resultat.erreurConnexion
      ) {

        afficherResultatPage(
          "❌ Erreur de connexion au serveur.",
          "#f8d7da"
        );

        return;

      }


      if (!resultat.success) {

        afficherResultatPage(
          "❌ " +
          (
            resultat.message ||
            "QR code introuvable."
          ),
          "#f8d7da"
        );

        return;

      }


      document
        .getElementById("nom")
        .textContent =
          resultat.nom || "—";


      document
        .getElementById("prenom")
        .textContent =
          resultat.prenom || "—";


      document
        .getElementById("fonction")
        .textContent =
          resultat.fonction || "—";


      const paiement =
        document.getElementById("paiement");


      paiement.textContent =
        resultat.paiement || "NON";


      if (
        String(resultat.paiement)
          .toUpperCase() === "OUI"
      ) {

        paiement.className =
          "value oui";

      } else {

        paiement.className =
          "value non";

      }


      document
        .getElementById("pageResult")
        .classList.add("hidden");

    }
  );

}


/* ==========================================
   INITIALISATION
   ========================================== */

function initialiser() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (id) {

    afficherPageQR(
      id
        .trim()
        .toUpperCase()
    );

    return;

  }


  demarrerScanner();

}


/* ==========================================
   LANCEMENT
   ========================================== */

window.addEventListener(
  "load",
  initialiser
);

</script>

</body>
</html>

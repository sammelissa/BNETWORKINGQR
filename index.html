<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BNETWORKING</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 25px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      padding: 14px 25px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ==========================================
       PAGE QR
       ========================================== */

    #pageQR {
      display: none;
    }

    .card {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      text-align: left;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .id {
      text-align: center;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .info {
      margin: 18px 0;
      font-size: 17px;
    }

    .label {
      font-weight: bold;
    }

    .paiement {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

  </style>
</head>


<body>


  <!-- =====================================================
       MODE SCANNER À L'ACCUEIL
       ===================================================== -->

  <div id="scannerPage">

    <h1>🎟️ BNETWORKING</h1>

    <p>Présentez le QR code devant la caméra</p>

    <div id="reader"></div>

    <div id="result">
      📷 En attente du scan...
    </div>

    <button onclick="restartScanner()">
      📷 Scanner le suivant
    </button>

  </div>



  <!-- =====================================================
       MODE PAGE QR PUBLIQUE
       Exemple :
       https://sammelissa.github.io/BNETWORKINGQR/?id=QR3
       ===================================================== -->

  <div id="pageQR">

    <div class="card">

      <div class="logo">
        BNETWORKING
      </div>

      <div class="id">
        <span class="label">ID :</span>
        <span id="qrId"></span>
      </div>

      <div class="info">
        <span class="label">Nom :</span>
        <span id="nom"></span>
      </div>

      <div class="info">
        <span class="label">Prénom :</span>
        <span id="prenom"></span>
      </div>

      <div class="info">
        <span class="label">Fonction :</span>
        <span id="fonction"></span>
      </div>

      <div
        id="paiement"
        class="paiement">
      </div>

    </div>

  </div>



  <script>


    // =====================================================
    // URL APPS SCRIPT
    // =====================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbw6W6Ed4HEF7j2BFzwKCVkpUfuK4Bkma1V9diSWD1vciB9RChRAeXMfEAsy0MOa95jBsA/exec";


    let scanner;
    let scanEnCours = false;



    // =====================================================
    // DÉTECTION DU MODE
    // =====================================================

    window.onload = function() {

      const params =
        new URLSearchParams(window.location.search);

      const id =
        params.get("id");


      // ==========================================
      // SI ?id=QR3
      // → PAGE QR
      // ==========================================

      if (id) {

        afficherPageQR(id);

      }

      // ==========================================
      // SINON
      // → SCANNER
      // ==========================================

      else {

        demarrerScanner();

      }

    };



    // =====================================================
    // PAGE QR PUBLIQUE
    // =====================================================

    function afficherPageQR(id) {

  // Cacher le scanner
  document.getElementById("scannerPage").style.display = "none";

  // Afficher la page QR
  document.getElementById("pageQR").style.display = "block";

  const identifiant =
    String(id).trim().toUpperCase();

  // Vérification du format
  if (!/^QR\d+$/i.test(identifiant)) {

    afficherErreurQR(
      "❌ QR NON VALIDE",
      "Identifiant incorrect."
    );

    return;
  }

  // Affichage de l'ID
  document.getElementById("qrId").textContent =
    identifiant;

  // Appel Apps Script
  fetch(
    APPS_SCRIPT_URL +
    "?id=" +
    encodeURIComponent(identifiant)
  )

  .then(response => {

    if (!response.ok) {
      throw new Error("Erreur serveur");
    }

    return response.json();

  })

  .then(data => {

    // ==========================================
    // QR INTROUVABLE
    // ==========================================

    if (!data.success) {

      afficherErreurQR(
        "❌ QR NON VALIDE",
        data.message || "QR introuvable."
      );

      return;
    }


    // ==========================================
    // AFFICHAGE DES INFORMATIONS
    // ==========================================

    document.getElementById("nom").textContent =
      data.nom || "-";

    document.getElementById("prenom").textContent =
      data.prenom || "-";

    document.getElementById("fonction").textContent =
      data.fonction || "-";


    // ==========================================
    // PAIEMENT
    // ==========================================

    const paiementElement =
      document.getElementById("paiement");


    if (
      String(data.paiement).toUpperCase() === "OUI"
    ) {

      paiementElement.textContent =
        "Paiement : OUI";

      paiementElement.style.background =
        "#d4edda";

    }

    else {

      paiementElement.textContent =
        "Paiement : NON";

      paiementElement.style.background =
        "#fff3cd";

    }

  })

  .catch(error => {

    console.error(error);

    afficherErreurQR(
      "❌ ERREUR",
      "Impossible de récupérer les informations du QR."
    );

  });

}



    // =====================================================
    // EXTRAIRE UNE INFORMATION
    // =====================================================

    function extraireInformation(
      texte,
      label
    ) {

      const lignes =
        texte.split("\n");


      for (
        let i = 0;
        i < lignes.length;
        i++
      ) {

        const ligne =
          lignes[i].trim();


        if (
          ligne.startsWith(label)
        ) {

          return ligne
            .substring(label.length)
            .trim();

        }

      }


      return "";

    }



    // =====================================================
    // ERREUR PAGE QR
    // =====================================================

    function afficherErreurQR(
      titre,
      message
    ) {

      document.getElementById("pageQR").innerHTML = `

        <div class="card">

          <div class="logo">
            BNETWORKING
          </div>

          <h2 style="text-align:center;">
            ${titre}
          </h2>

          <p style="text-align:center;">
            ${message}
          </p>

        </div>

      `;

    }



    // =====================================================
    // DÉMARRAGE DU SCANNER
    // =====================================================

    function demarrerScanner() {

      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        onScanSuccess

      )

      .catch(function(error) {

        afficherResultat(

          "❌ Impossible d'accéder à la caméra.",

          "#f8d7da"

        );

      });

    }



    // =====================================================
    // QR SCANNÉ PAR L'APPLICATION D'ACCUEIL
    // =====================================================

    function onScanSuccess(
      decodedText
    ) {

      if (scanEnCours) {
        return;
      }


      scanEnCours = true;


      afficherResultat(

        "⏳ Vérification du QR code...",

        "#fff3cd"

      );


      scanner.pause(true);



      // ==========================================
      // EXTRACTION DE QR1 / QR2 / QR3...
      // ==========================================

      let identifiant = "";


      try {

        const url =
          new URL(decodedText);


        identifiant =
          url.searchParams.get("id");

      }

      catch (error) {

        identifiant =
          decodedText;

      }


      identifiant =
        String(identifiant)
          .trim()
          .toUpperCase();



      // ==========================================
      // VÉRIFICATION
      // ==========================================

      if (
        !/^QR\d+$/i.test(identifiant)
      ) {

        afficherResultat(

          "❌ QR NON VALIDE",

          "#f8d7da"

        );

        return;

      }



      // ==========================================
      // QR1
      // devient
      // BNETWORKING-QR1
      // ==========================================

      const codeValidation =
        "BNETWORKING-" +
        identifiant;



      // ==========================================
      // ENVOI À APPS SCRIPT
      // ==========================================

      fetch(

        APPS_SCRIPT_URL +
        "?code=" +
        encodeURIComponent(
          codeValidation
        )

      )

      .then(response => {

        return response.json();

      })

      .then(data => {

        afficherResultat(

          data.message,

          data.color

        );

      })

      .catch(error => {

        console.error(error);


        afficherResultat(

          "❌ Erreur de connexion au serveur.",

          "#f8d7da"

        );

      });

    }



    // =====================================================
    // AFFICHAGE DU RÉSULTAT
    // =====================================================

    function afficherResultat(
      message,
      couleur
    ) {

      const result =
        document.getElementById(
          "result"
        );


      result.innerHTML =
        message;


      result.style.background =
        couleur;

    }



    // =====================================================
    // SCANNER LE QR SUIVANT
    // =====================================================

    function restartScanner() {

      scanEnCours = false;


      afficherResultat(

        "📷 En attente du scan...",

        "#f5f5f5"

      );


      scanner.resume();

    }

  </script>

</body>
</html>
